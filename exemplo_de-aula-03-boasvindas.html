<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funçoes Seta</title>
</head>
<body>
    <button id="botao">
        Mostrar Mensagem
    </button>
    <p id="resultado"></p>

    <script>
        const boasVindas = ()=>{
            return "Ola obrigado por visitar a nossa pagina :)";
        };


        const botao = document.getElementById("botao");
        const resultado=document.getElementById("resultado");

        botao.addEventListener("click",()=> {
            resultado.innerHTML = `${boasVindas()}`

        });


    </script>
</body>
</html>
