<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript no cabeçalho e no corpo</title>

    <style>
        .destaque{
            color: red;
            font-size: 20px;
            font-weight: bold;
        }
    </style>

    <script>
        alert("O javascript do cabeçalho foi executado!");
    </script>
</head>
<body>
    <h1>Javascript incorporado</h1>

    <p>Este conteudo foi escrito diretamente com HTML</p>

    <script>
        document.write('<p class="destaque">Este conteudo foi criado pelo javascript</p>')
    </script>
</body>
</html>
