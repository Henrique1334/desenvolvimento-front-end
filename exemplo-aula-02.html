<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de css</title>

    <style>
        .titulo{
            color: rgb(236, 122, 122);
            font-size: 23px;
            font-weight: bold;
            text-align: center;
        }

        .primeira-div{
            color: white;
            font-size: 23px;
            background-color: rgb(162, 162, 233);
            font-weight: bold;
            font-style: italic;
        }

        .Segunda-div{
            color: white;
            background-color: rgb(146, 146, 236);
            font-size: 33px;
            font-weight: bold;
            font-style: italic;
        }

        .paragrafo1{
            color: red;
            background-color: aquamarine;
            font-size: 20px;
            font-style: italic;
            font-weight: bold;
        }

        .paragrafo2{
            color: white;
            background-color: red;
            font-weight: bold;
            font-size: 21px;
            font-style: inherit;
        }

    </style>
</head>
<body>
    <h1 class="titulo">Meu primeiro estudo de css</h1>

    <div class="primeira-div">
        <p class="paragrafo1">Primeiro paragrafo da div</p>
        <p class="segundo paragrafo2">Segundo paragrafo da div</p>
    </div>

    <div class="Segunda-div">
        <p class="paragrafos">Paragrafo da  segunda div da pagina</p>
    </div>
</body>
</html>
