<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anatomia das tags para HTML</title>
</head>
<body>
    <H1>anatomia das tags</H1>
    <p>
        As tags são os elementos basicos 
        que compoem uma pagina web. cada tag
        tem uma estrutura especifica e desempenham 
        um papel importante na organização 
        e apresentação do conteúdo.
    </p>
    <p>
        Este é o exemplo de paragrafo que pode
         conter <strong>texto em negrito</strong> ou
         <em> texto em italico</em> 
    </p>
</body>
</html>
