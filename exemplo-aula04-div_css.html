<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplp: div, br, hr</title>
    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{
            background-color: red;
            color: black;
            border: 2px solid green;
            font-size: 20px;
            
        }
        #secundaria{
            background-color: black;
            color: red;
            font-size: 29px;
            border: 3px solid purple;
            margin: 20px;
        }
        hr{
            color: red;
            border-top: 2px solid #287528;
        }
    </style>
</head>
<body>
    <div id="principal">
        esta é a primeira linha.
        <br>
        esta e a segunda linha.
    </div>
    <hr>
    <div id="secundaria">
         esta outra divisao da pagina.
        <br>
        aqui começa uma nova linha
    </div>
</body>
</html>
