<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    
</head>
<body>
    <h1> tabelas em HTML</h1>
    <p>
        As tabelas em HTML sao usadas para <br>
        organizar dados em linhas em colunas.
    </p>
    <br>
    <hr>
    <br>

<table border="1">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>ana</td>
            <td>45</td>
            <td>santa catarina</td>
        </tr>
        <tr>
            <td>henrique</td>
            <td>25</td>
            <td>santos</td>
        </tr>
    </tbody>
    
</table>
<br>
<hr>
<br>

</body>
</html>
